name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
          cache: true
      - name: Set up Node and npm
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify game, site, and package
        run: deno task verify
      - name: Confirm release tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Publish public package
        run: npm publish
        env:
          # Needed to bootstrap the first release. After trusted publishing is configured
          # on npm, npm uses the workflow's short-lived OIDC identity instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
